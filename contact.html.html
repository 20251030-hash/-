<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>泰好飲 ThaiTea - 聯絡我們</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">泰好飲 ThaiTea</div>
    <ul class="nav-links">
      <li><a href="index.html">首頁</a></li>
      <li><a href="products.html">產品介紹</a></li>
      <li><a href="contact.html" class="active">聯絡我們</a></li>
    </ul>
  </nav>

  <main class="container">
    <h2 class="page-title">聯絡我們</h2>
    <p class="subtitle">有任何查詢或團購合作，歡迎留言給我們！</p>
    
    <form id="contactForm" class="contact-form">
      <label for="name">你的名字：</label>
      <input type="text" id="name" required placeholder="請輸入名字">

      <label for="email">電子郵件：</label>
      <input type="email" id="email" required placeholder="example@email.com">

      <label for="message">留言內容：</label>
      <textarea id="message" rows="4" required placeholder="想查詢哪一款產品呢？"></textarea>

      <button type="submit" class="btn">送出訊息</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 泰好飲 ThaiTea. 版權所有。</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
